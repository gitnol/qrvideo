<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 104" width="760" height="104" role="img" aria-label="Datei → GnuPG → QR-Video → Kanal → Datei">
<title>Datei → GnuPG → QR-Video → Kanal → Datei</title>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#1f2937} .muted{fill:#6b7280} .accent{fill:#d97706} .box{fill:#f8fafc;stroke:#cbd5e1}
.arrow{stroke:#94a3b8;fill:none} .tip{fill:#94a3b8}
@media (prefers-color-scheme: dark){text{fill:#e5e7eb} .muted{fill:#9ca3af} .accent{fill:#fbbf24}
.box{fill:#111827;stroke:#374151} .arrow{stroke:#6b7280} .tip{fill:#6b7280}}
</style>
<rect class="box" x="4" y="4" width="124" height="96" rx="12" stroke-width="1.5"/>
<text x="66" y="40" font-size="16" font-weight="700" text-anchor="middle">Datei</text>
<text x="66" y="64" font-size="11" class="muted" text-anchor="middle">beliebiger Inhalt</text>
<text x="66" y="80" font-size="11" class="muted" text-anchor="middle"></text>
<path class="arrow" d="M134 52 H148" stroke-width="2"/>
<path class="tip" d="M150 52 l-7 -5 v10 z"/>
<rect class="box" x="156" y="4" width="124" height="96" rx="12" stroke-width="1.5"/>
<text x="218" y="40" font-size="16" font-weight="700" text-anchor="middle">GnuPG</text>
<text x="218" y="64" font-size="11" class="muted" text-anchor="middle">verschlüsselt</text>
<text x="218" y="80" font-size="11" class="muted" text-anchor="middle">und signiert</text>
<path class="arrow" d="M286 52 H300" stroke-width="2"/>
