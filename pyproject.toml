[project]
name = "qrcodegenmod"
version = "2.0.0.dev0"
description = "Schneller QR-Code-Generator (Fork von nayuki/QR-Code-generator@6e088f7) aus der Bachelor-Thesis 2019, modernisiert 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# Numba beschleunigt Reed-Solomon und die Masken-Bewertung. Ohne Numba greift ein NumPy-Fallback.
jit = ["numba>=0.60"]
# Video-Pipeline qrvideo (ffmpeg-Binary kommt mit imageio-ffmpeg)
video = ["imageio-ffmpeg>=0.5"]
crypto = ["python-gnupg>=0.5.4"]
# yt-dlp >= 2026.7.4 wegen CVE-2026-55404/50574/50023/26331 (security/DEPENDENCY_AUDIT.md)
youtube = ["yt-dlp>=2026.7.4", "google-api-python-client>=2.150", "google-auth-oauthlib>=1.2"]
all = ["qrcodegenmod[jit,video,crypto,youtube]"]

[project.scripts]
qrvideo = "qrvideo.cli:main"
qrvideo-gui = "qrvideo_gui.app:main"

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.5",
    "numba>=0.60",
    "pytest>=8.3",
    "python-gnupg>=0.5.4",
    "pytest-cov>=5.0",
    "qrcodegen==1.8.0",  # offizielle Referenzimplementierung von nayuki = Testorakel
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrcodegenmod", "src/qrvideo", "src/qrvideo_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing:skip-covered"
markers = [
    "slow: lange Laeufe (alle Versionen x Masken)",
    "integration: braucht ffmpeg, Videodateien oder GnuPG",
    "live: braucht Netz/YouTube (nie in CI)",
]

[tool.coverage.run]
source = ["qrcodegenmod", "qrvideo", "qrvideo_gui"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy", "docs"]

[tool.ruff.format]
exclude = ["src/qrcodegenmod/_tables.py"]  # Tabellen bleiben spaltenweise lesbar

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
# Eigene Pakete immer aus src/ aufloesen: sonst nimmt ein Teillauf (`mypy tests/x.py`) das installierte Paket ohne
# py.typed, legt es so in den gemeinsamen Cache, und der naechste volle Lauf meldet faelschlich fehlende Untermodule (I28).
mypy_path = "src"
exclude = ["^legacy/"]

[[tool.mypy.overrides]]
module = ["qrcodegen", "numba", "imageio_ffmpeg", "gnupg", "yt_dlp", "googleapiclient.*", "google_auth_oauthlib.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["qrvideo_gui", "qrvideo", "qrcodegenmod"]

[[tool.importlinter.contracts]]
# Schichtregel aus docs/architecture/PROJECT_LAYOUT.md: Imports nur nach unten (Gate 5, seit I25)
name = "Schichten qrvideo_gui -> qrvideo -> qrcodegenmod"
type = "layers"
layers = ["qrvideo_gui", "qrvideo", "qrcodegenmod"]
